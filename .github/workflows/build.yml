name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> .env
          echo "NEOXR_API_KEY=VinzKeyNeoxr0021" >> .env
          echo "BOTCAHX_API_KEY=VinzKey0110" >> .env

      - name: Restore keystore dari Secret
        run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d ' \n\r' | base64 -d > debug.keystore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Melofy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
